name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # =========================================================
  # JOB 1: BUILD & TEST
  # =========================================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x # Đã nâng cấp lên .NET 10

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        env: 
          AI__AzureOpenAI__ApiKey: "fake-key-for-testing-only"
          AI__AzureOpenAI__BaseUrl: "https://fake-url.openai.azure.com"
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=detailed" --blame-crash

  # =========================================================
  # JOB 2: DOCKER BUILD & PUSH LÊN GHCR
  # =========================================================
  publish-to-ghcr:
    needs: build-and-test # Bắt buộc Job 1 phải thành công (màu xanh) mới chạy Job 2
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write # Cấp quyền cho Actions được phép ghi (push) image
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x # Đã nâng cấp lên .NET 10

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Docker image
        run: |
          dotnet publish src/API/TechShop.ECommerce.Api/TechShop.ECommerce.Api.csproj \
            --os linux --arch x64 -c Release \
            -t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=trongnghia-17/techshop-api \
            '-p:ContainerImageTags="latest;${{ github.sha }}"'