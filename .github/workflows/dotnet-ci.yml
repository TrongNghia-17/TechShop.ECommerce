name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # =========================================================
  # NHÁNH 1: BUILD & TEST
  # =========================================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  # =========================================================
  # NHÁNH 2: DOCKER BUILD & PUSH LÊN ACR
  # =========================================================
  publish-to-acr:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          dotnet publish src/API/TechShop.ECommerce.Api/TechShop.ECommerce.Api.csproj \
            --os linux-musl --arch x64 -c Release \
            -t:PublishContainer \
            -p:ContainerRegistry=${{ secrets.ACR_LOGIN_SERVER }} \
            -p:ContainerRepository=techshop-api \
            '-p:ContainerImageTags="latest;${{ github.sha }}"'