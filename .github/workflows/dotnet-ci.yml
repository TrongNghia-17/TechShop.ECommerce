name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Setup .NET SDK
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3. Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # 4. Build the project in Release mode
    - name: Build project
      run: dotnet build --no-restore --configuration Release

    # 5. Run automated tests
    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal

    # ---------------------------------------------------------
    # DOCKER BUILD & PUSH SECTION (Only runs on push to main)
    # ---------------------------------------------------------

    # 6. Authenticate with Azure Container Registry
    - name: Log in to Azure Container Registry
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 7. Build and push Docker image to ACR
    - name: Build and push Docker image
      if: github.event_name == 'push'
      run: |
        # Đặt 2 nhãn: 'latest' (luôn là bản mới nhất) và 'mã SHA' (để dễ rollback lại bản cũ nếu lỗi)
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/techshop-api:latest -t ${{ secrets.ACR_LOGIN_SERVER }}/techshop-api:${{ github.sha }} -f src/API/TechShop.ECommerce.Api/Dockerfile .
        
        # Đẩy tất cả các nhãn lên Azure
        docker push --all-tags ${{ secrets.ACR_LOGIN_SERVER }}/techshop-api