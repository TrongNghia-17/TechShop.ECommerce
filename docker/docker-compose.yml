name: techshopecommerce

services:
  # ==========================================
  # 1. ỨNG DỤNG CỐT LÕI (API)
  # ==========================================
  api:
    image: techshop-api:latest
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}

      # --- KẾT NỐI DATABASE & CACHE ---
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ConnectionStrings__Redis=redis:6379

      # --- CẤU HÌNH THEO APPSETTINGS.JSON ---
      - JwtSettings__Key=${JWT_SECRET_KEY}

      - EmailSettings__ApiKey=${SENDGRID_API_KEY}
      - EmailSettings__FromAddress=${EMAIL_FROM_ADDRESS}

      - StripeSettings__SecretKey=${STRIPE_SECRET_KEY}
      - StripeSettings__WebhookSecret=${STRIPE_WEBHOOK_SECRET}
      - StripeSettings__SuccessUrl=${STRIPE_SUCCESS_URL}
      - StripeSettings__CancelUrl=${STRIPE_CANCEL_URL}
      - StripeSettings__Currency=${STRIPE_CURRENCY}

      - AzureStorage__ConnectionString=${AZURE_STORAGE_CONNECTION}

      # --- CẤU HÌNH TRACING TRONG DOCKER ---
      - OpenTelemetry__OtlpEndpoint=http://otel-collector:4317

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
      otel-collector:
        condition: service_started

  # ==========================================
  # 2. HẠ TẦNG DỮ LIỆU (POSTGRES & REDIS & OLLAMA)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - techshop_ollama_data:/root/.ollama

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - techshop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - techshop_redis_data:/data

  # ==========================================
  # 3. QUAN TRẮC (SEQ, OTEL, PROMETHEUS, GRAFANA, JAEGER)
  # ==========================================
  seq:
    image: datalust/seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:80"
    volumes:
      - techshop_seq_data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: [ "--config=/etc/otelcol/config.yml" ]
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
      - "13133:13133"
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - techshop_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - techshop_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4319:4317"
      - "4320:4318"

# ==========================================
# 4. VOLUMES
# ==========================================
volumes:
  techshop_ollama_data:
    name: techshop_ollama_data
  techshop_postgres_data:
    name: techshop_postgres_data
  techshop_seq_data:
    name: techshop_seq_data
  techshop_redis_data:
    name: techshop_redis_data
  techshop_prometheus_data:
    name: techshop_prometheus_data
  techshop_grafana_data:
    name: techshop_grafana_data
